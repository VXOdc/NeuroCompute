<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="6" stroke="#2e2e33" stroke-width="0.75" fill="none"/>

  <!-- N neural traces -->
  <g filter="url(#glow)">
    <!-- Left vertical -->
    <line x1="8" y1="7.5" x2="8" y2="24.5" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="round"/>
    <!-- Diagonal -->
    <line x1="8" y1="7.5" x2="24" y2="24.5" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="round"/>
    <!-- Right vertical -->
    <line x1="24" y1="7.5" x2="24" y2="24.5" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="round"/>
  </g>

  <!-- Neural nodes -->
  <circle cx="8"  cy="7.5"  r="2.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="24" cy="7.5"  r="2.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="8"  cy="24.5" r="2.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="24" cy="24.5" r="2.5" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Midpoint connector dot (crossing point) -->
  <circle cx="16" cy="16" r="1.5" fill="#1d3f6e" stroke="#3b82f6" stroke-width="0.75"/>
</svg>
